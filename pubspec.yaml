name: flutter_ringtone_player_advanced
description: A simple player for system default ringtones, alarms and notifications
version: 5.0.2
homepage: https://github.com/nafiskabbo/flutter_ringtone_player_advanced
repository: https://github.com/nafiskabbo/flutter_ringtone_player_advanced
issue_tracker: https://github.com/nafiskabbo/flutter_ringtone_player_advanced/issues

environment:
  sdk: ">=3.0.3 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.inway.ringtone.player
        pluginClass: FlutterRingtonePlayerPlugin
      ios:
        pluginClass: FlutterRingtonePlayerPlugin
